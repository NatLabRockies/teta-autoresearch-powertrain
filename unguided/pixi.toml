[workspace]
channels = ["conda-forge"]
name = "teta-autoresearch"
platforms = ["osx-arm64", "linux-aarch64", "linux-64"]
version = "0.1.0"

[tasks]
mypy = "mypy ."
lint = "ruff check"
format = "ruff format --check"
format_fix = "ruff format"
dprint = "dprint check"
dprint_fix = "dprint fmt"
test = "python -m unittest discover -s tools -t . -p 'test_*.py'"
check = { depends-on = ["mypy", "lint", "format", "dprint", "test"] }
fix = { depends-on = ["format_fix", "dprint_fix"] }

[dependencies]
python = "3.13.*"
ipykernel = ">=7.2.0,<8"
mypy = ">=1.19.1,<2"
pip = ">=26.0.1,<27"
numpy = ">=2.4.3,<3"
matplotlib = ">=3.10.8,<4"
pandas = ">=3.0.1,<4"
pyarrow = ">=23.0.1,<24"
scikit-learn = ">=1.8.0,<2"
dprint = ">=0.50.0,<0.51"
ruff = ">=0.15.10,<0.16"
pandas-stubs = ">=3.0.0.260204,<4"
shapely = ">=2.1.2,<3"

# PyTorch: GPU build on linux-64 (via the conda-forge `pytorch-gpu` metapackage),
# CPU build elsewhere. The `[system-requirements]` cuda entry tells pixi the
# host has a CUDA 12 driver so it will prefer CUDA-enabled package builds.
[system-requirements]
cuda = "12"

[target.linux-64.dependencies]
pytorch-gpu = ">=2.10.0,<3"

[target.osx-arm64.dependencies]
pytorch = ">=2.10.0,<3"

[target.linux-aarch64.dependencies]
pytorch = ">=2.10.0,<3"
