[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routee-autoresearch"
version = "0.1.0"
description = "Template for LLM-driven and optimizer-driven autoresearch experiments."
requires-python = ">=3.13"

[tool.setuptools.packages.find]
include = ["optimizers*", "domains*"]

[tool.mypy]
files = ["fixed_utils.py", "optimizers", "domains"]
ignore_missing_imports = true
