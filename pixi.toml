[workspace]
authors = ["Nicholas Reinicke <Nicholas.Reinicke@nrel.gov>"]
channels = ["conda-forge"]
name = "routee-autoresearch"
platforms = ["osx-arm64", "linux-aarch64", "linux-64"]
version = "0.1.0"

[tasks]
mypy = "mypy ."
lint = "ruff check"
format = "ruff format --check"
format_fix = "ruff format"
dprint = "dprint check"
dprint_fix = "dprint fmt"
check = { depends-on = ["mypy", "lint", "format", "dprint"] }
fix = { depends-on = ["format_fix", "dprint_fix"] }

[dependencies]
python = "3.13.*"
ipykernel = ">=7.2.0,<8"
mypy = ">=1.19.1,<2"
pip = ">=26.0.1,<27"
numpy = ">=2.4.3,<3"
matplotlib = ">=3.10.8,<4"
pandas = ">=3.0.1,<4"
pyarrow = ">=23.0.1,<24"
scikit-learn = ">=1.8.0,<2"
pytorch = ">=2.10.0,<3"
dprint = ">=0.50.0,<0.51"
ruff = ">=0.15.10,<0.16"
pandas-stubs = ">=3.0.0.260204,<4"
shapely = ">=2.1.2,<3"
# Optimizer-mode deps. The LLM-mode harness does not import these; they
# are folded into the default env to keep optimizer trees runnable without
# a separate environment. Move to [feature.optimizer.dependencies] if you
# want to trim the LLM-only Docker image.
optuna = ">=3.0,<5"
xgboost = ">=2.0,<3"
lightgbm = ">=4.0,<5"
